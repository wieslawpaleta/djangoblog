{% load static %}
    <html lang="pl">
        <head>
            <meta charset="UTF-8">
            <title>Blog dla programistów</title>
            <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
            <link rel="stylesheet" href="{% static 'css/blog.css' %}">
        </head>
<body class="lato-regular">
    <div class="page-header">
        <h1><a href="">Witam na stronie bloga dla programistów!</a></h1>
        <h2>Blog o programowaniu</h2>
    </div>

    {% comment "komentarz autora" %}
    Tutaj lista postów
    {% endcomment %}
<div class="content container">
    <div class="row">
    {% for post in posts %}
    <div class="col-md-8"></div>
       <div class="post">
       <div class="data">
           <p>opublikowany: {{ post.published_date }}</p>
       </div>
        <h2><a href="">{{ post.title }}</a></h2>
        <em>{{ post.text|linebreaksbr }}</em>
        </div>
    {% endfor %}
</div>
</div>
</div>
    <div class="stopka">

    </div>

</body>

</html>
